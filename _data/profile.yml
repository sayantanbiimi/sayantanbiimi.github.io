introduction: I work at the intersection of Bayesian methodology, high-dimensional inference, graphical models,
  and statistical learning, with applications across scientific and decision-making settings.
about:
- I am a Professor in the Operations Management & Quantitative Techniques area at the Indian Institute of Management
  Indore, where I also serve as Chair of the Post Graduate Programme in Management.
- Previously, I served as Chair of Research & Publications at IIM Indore (April 2022–March 2024) and held the Young
  Faculty Research Chair (January 2019–December 2021). Before joining IIM Indore, I was a postdoctoral fellow in
  Biostatistics at the University of Texas MD Anderson Cancer Center.
- I received my Ph.D. in Statistics from North Carolina State University in 2014, advised by Professor Subhashis
  Ghosal. My dissertation received an honorable mention for the Leonard J. Savage Award from the International Society
  for Bayesian Analysis.
