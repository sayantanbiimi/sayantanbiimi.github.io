- id: degrees
  title: Academic qualifications
  html: '<div class="timeline"><div class="timeline-item"><div class="timeline-time">2010 – 2014</div><h3>Ph.D.
    in Statistics</h3><p><strong>North Carolina State University, Raleigh, NC, USA</strong></p><p>Dissertation:
    Bayesian Inference for High Dimensional Models: Convergence Properties and Computational Issues. Advisor: Professor
    Subhashis Ghosal.</p></div><div class="timeline-item"><div class="timeline-time">2008 – 2010</div><h3>Master
    of Statistics (M.Stat.)</h3><p><strong>Indian Statistical Institute, Kolkata, India</strong></p></div><div class="timeline-item"><div
    class="timeline-time">2005 – 2008</div><h3>B.Sc. (Honours) in Statistics</h3><p><strong>St. Xavier’s College,
    Kolkata, India</strong></p></div></div><div class="highlight">The doctoral dissertation received an <strong>Honorable
    Mention for the Leonard J. Savage Award</strong> for Bayesian Statistics (Theory and Methods), presented by
    the International Society for Bayesian Analysis.</div>'
